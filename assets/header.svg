<svg xmlns="http://www.w3.org/2000/svg" width="195" height="30" viewBox="0 0 195 30">
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" from="0" to="195" dur="2.2s" fill="freeze"
                 calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>
  <text x="0" y="21" font-family="'Cascadia Code', monospace" font-weight="700"
        font-size="17" fill="#0EA5E9" clip-path="url(#reveal)">👋 Hi, I'm Tanbai.</text>
</svg>
